<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of Krishna Kumar Tummala, a full-stack engineer at ExcelHire. Interview platforms, APIs, and delivery systems built with React, Angular, NestJS, and MongoDB."
    />
    <meta name="theme-color" content="#0e1014" />
    <title>Krishna Kumar Tummala · Full Stack Engineer</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem("theme")
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
          document.documentElement.classList.add(theme)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute("content", theme === "dark" ? "#0e1014" : "#f4f1ea")
        } catch (error) {
          document.documentElement.classList.add("dark")
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
